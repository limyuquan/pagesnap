<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: wide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Horizontal overflow: a 3000 × 2000 CSS px grid of 500 px cells (6 columns × 4 rows).
  Cell (r, c) colour = colors[(r * 6 + c) % 8]. Labels read "r,c".
-->
<style>
  html, body { margin: 0; padding: 0; }
  body { font: 600 26px/1 system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(6, 500px); grid-auto-rows: 500px; width: 3000px; }
  .cell { box-sizing: border-box; border: 2px solid #000; padding: 16px; }
  .cell span { background: rgba(255,255,255,.85); padding: 4px 8px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  const colors = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c'];
  const grid = document.getElementById('grid');
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 6; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.background = colors[(r * 6 + c) % 8];
      cell.innerHTML = `<span>${r},${c}</span>`;
      grid.append(cell);
    }
  }
  window.__fixture = { name: 'wide', cssWidth: 3000, cssHeight: 2000, cell: 500, columns: 6, rows: 4, colors };
</script>
</body>
</html>
