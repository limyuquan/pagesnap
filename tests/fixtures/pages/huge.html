<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: huge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  70,000 CSS px tall (140,000 image px at DPR 2): beyond the 65,535 px canvas side limit, so the
  capture must tile and exports must split. 70 bands of 1000 px, colour = colors[i % 8], 2 px
  black top rule, label "Band i · y=…".
-->
<style>
  html, body { margin: 0; padding: 0; }
  body { font: 600 28px/1.2 system-ui, sans-serif; }
  .band { height: 1000px; box-sizing: border-box; border-top: 2px solid #000; padding: 20px 24px; }
  .band span { background: rgba(255,255,255,.85); padding: 4px 10px; }
</style>
</head>
<body>
<script>
  const colors = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 70; i++) {
    const band = document.createElement('div');
    band.className = 'band';
    band.style.background = colors[i % 8];
    band.innerHTML = `<span>Band ${i} · y=${i * 1000}</span>`;
    frag.append(band);
  }
  document.body.append(frag);
  window.__fixture = { name: 'huge', cssHeight: 70000, bandHeight: 1000, colors };
</script>
</body>
</html>
